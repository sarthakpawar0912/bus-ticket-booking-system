<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}">
    <title>Team Member Profile</title>
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<section class="page-title-bar">
    <div class="container">
        <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
            <div>
                <p class="mb-2 text-uppercase small fw-semibold opacity-75">Team Contribution</p>
                <h2 th:text="${member.name}">Member Name</h2>
                <p class="mb-0 mt-2 opacity-75" th:text="${member.role}">Role</p>
            </div>
            <a th:href="@{/}" class="btn btn-light">
                <i class="bi bi-arrow-left me-2"></i>Back to Home
            </a>
        </div>
    </div>
</section>

<section class="pb-5">
    <div class="container">
        <div class="member-profile-card">
            <div class="row g-4 align-items-start">
                <div class="col-lg-4">
                    <div class="member-summary-panel">
                        <div class="team-avatar member-profile-avatar mx-0"
                             th:classappend="${' avatar-' + member.theme}">
                            <img th:if="${member.photo}" th:src="@{${member.photo}}" th:alt="${member.name}">
                            <span th:unless="${member.photo}" th:text="${member.initials}">TM</span>
                        </div>
                        <span class="badge profile-badge"
                              th:classappend="${' text-bg-' + member.theme}"
                              th:text="${member.role}">Role</span>
                        <p class="text-muted mt-3 mb-0" th:text="${member.summary}">Summary</p>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="row g-4">
                        <div class="col-12">
                            <div class="profile-section-card">
                                <h4><i class="bi bi-kanban-fill me-2"></i>Work Completed</h4>
                                <ul class="profile-list mb-0">
                                    <li th:each="item : ${member.workItems}" th:text="${item}">Work item</li>
                                </ul>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="profile-section-card">
                                <h4><i class="bi bi-link-45deg me-2"></i>Endpoints And Functional Links</h4>
                                <div class="endpoint-grid">
                                    <a th:each="endpoint : ${member.endpoints}"
                                       th:href="${endpoint.url}"
                                       class="endpoint-card">
                                        <div class="d-flex justify-content-between align-items-start gap-3">
                                            <div>
                                                <h5 th:text="${endpoint.label}">Endpoint</h5>
                                                <p class="mb-2 text-muted small" th:text="${endpoint.description}">Description</p>
                                            </div>
                                            <i class="bi bi-box-arrow-up-right"></i>
                                        </div>
                                        <code th:text="${endpoint.url}">/api/example</code>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
