<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container my-5">
    <div class="text-center">
        <div class="success-icon">
            <i class="bi bi-check-lg"></i>
        </div>
        <h2 class="fw-bold text-success mb-2">Payment Successful!</h2>
        <p class="text-muted" th:text="${payment.message}">Your payment has been processed successfully.</p>
    </div>

    <div class="card mx-auto mt-4" style="max-width: 550px;">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0"><i class="bi bi-receipt me-2"></i>Payment Receipt</h5>
        </div>
        <div class="card-body">
            <div class="row mb-2">
                <div class="col-5 fw-bold">Payment ID:</div>
                <div class="col-7" th:text="${payment.paymentId}"></div>
            </div>
            <div class="row mb-2">
                <div class="col-5 fw-bold">Booking ID:</div>
                <div class="col-7" th:text="${payment.bookingId}"></div>
            </div>
            <div class="row mb-2">
                <div class="col-5 fw-bold">Customer ID:</div>
                <div class="col-7" th:text="${payment.customerId}"></div>
            </div>
            <div class="row mb-2">
                <div class="col-5 fw-bold">Amount Paid:</div>
                <div class="col-7 text-success fw-bold fs-5" th:text="'Rs. ' + ${payment.amount}"></div>
            </div>
            <div class="row mb-2">
                <div class="col-5 fw-bold">Status:</div>
                <div class="col-7"><span class="badge bg-success" th:text="${payment.paymentStatus}"></span></div>
            </div>
            <div class="row">
                <div class="col-5 fw-bold">Date:</div>
                <div class="col-7" th:text="${payment.paymentDate}"></div>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/api/bookings/{id}/ticket(id=${payment.bookingId})}" class="btn btn-outline-primary btn-lg me-2">
            <i class="bi bi-download me-1"></i>Download Ticket
        </a>
        <a th:href="@{/}" class="btn btn-outline-secondary btn-lg">
            <i class="bi bi-house me-1"></i>Go Home
        </a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
