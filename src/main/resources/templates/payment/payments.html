<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"><title>BusBooking</title></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="page-title-bar">
    <div class="container">
        <h2><i class="bi bi-credit-card me-2"></i>Payment Management</h2>
    </div>
</div>

<div class="container">
    <div th:if="${message}" class="alert alert-success flash-message" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${message}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger flash-message" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
    </div>

    <div class="table-container">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Booking ID</th>
                        <th>Customer ID</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${payments}">
                        <td th:text="${p.paymentId}"></td>
                        <td th:text="${p.bookingId}"></td>
                        <td th:text="${p.customerId}"></td>
                        <td th:text="'Rs. ' + ${p.amount}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${p.paymentStatus == 'Success' ? 'bg-success' : 'bg-danger'}"
                                  th:text="${p.paymentStatus}"></span>
                        </td>
                        <td th:text="${p.paymentDate}"></td>
                        <td>
                            <a th:href="@{/api/payments/{id}/ticket(id=${p.paymentId})}" class="btn btn-sm btn-outline-primary btn-action">
                                <i class="bi bi-download"></i> Ticket
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(payments)}">
                        <td colspan="7" class="text-center text-muted py-4">No payments found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
