<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-arrow-counterclockwise me-2 text-warning"></i>Refund Payment</h2>
        <a th:href="@{/view/payments}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Back
        </a>
    </div>

    <div th:if="${message}" class="alert alert-success">
        <i class="bi bi-check-circle me-1"></i><span th:text="${message}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <p class="text-muted">
                Enter the payment ID to refund. The payment's status flips to
                <code>Failed</code> and the transaction is marked refunded. The linked
                booking is left untouched - use the Cancel Booking flow separately if you
                also want to release the seat.
            </p>
            <form th:action="@{/view/payments/refund}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Payment ID</label>
                    <input type="number" name="paymentId" class="form-control" required
                           placeholder="201" min="1"/>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-warning">
                        <i class="bi bi-arrow-counterclockwise me-1"></i>Process Refund
                    </button>
                    <a th:href="@{/view/payments}" class="btn btn-outline-secondary">Back</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
