<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container my-5">
    <div class="form-container" style="max-width: 550px;">
        <h2 class="text-center mb-4"><i class="bi bi-credit-card me-2 text-primary"></i>Payment Checkout</h2>

        <!-- Booking Details -->
        <div class="card mb-4 bg-light">
            <div class="card-body">
                <h6 class="card-title text-muted mb-3">Booking Details</h6>
                <div class="row mb-2">
                    <div class="col-5 fw-bold">Booking ID:</div>
                    <div class="col-7" th:text="${bookingId}"></div>
                </div>
                <div class="row mb-2">
                    <div class="col-5 fw-bold">Amount:</div>
                    <div class="col-7 text-primary fw-bold fs-5" th:text="'Rs. ' + ${amount}"></div>
                </div>
            </div>
        </div>

        <form th:action="@{/view/payments/process}" method="post">
            <input type="hidden" name="bookingId" th:value="${bookingId}">
            <input type="hidden" name="amount" th:value="${amount}">

            <div class="mb-3">
                <label for="customerId" class="form-label fw-bold">Customer</label>
                <select class="form-select" id="customerId" name="customerId" required>
                    <option value="">-- Select Customer --</option>
                    <option th:each="c : ${customers}"
                            th:value="${c.id}"
                            th:text="${c.name + ' (' + c.email + ')'}"></option>
                </select>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-success btn-lg">
                    <i class="bi bi-lock-fill me-2"></i>Pay Now
                </button>
            </div>
        </form>

        <p class="text-center text-muted small mt-3">
            <i class="bi bi-shield-lock me-1"></i>Your payment is secure and encrypted
        </p>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
