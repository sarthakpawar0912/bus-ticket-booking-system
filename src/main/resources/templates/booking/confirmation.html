<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container my-5">
    <div class="text-center">
        <div class="success-icon">
            <i class="bi bi-check-lg"></i>
        </div>
        <h2 class="fw-bold text-success mb-3">Booking Confirmed!</h2>
        <p class="text-muted" th:text="${booking.message}">Your seats have been booked successfully.</p>
    </div>

    <div class="card mx-auto mt-4" style="max-width: 600px;">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"><i class="bi bi-ticket-perforated me-2"></i>Booking Details</h5>
        </div>
        <div class="card-body">
            <div class="row mb-2">
                <div class="col-5 fw-bold">Booking ID(s):</div>
                <div class="col-7" th:text="${booking.bookingIds}"></div>
            </div>
            <div class="row mb-2">
                <div class="col-5 fw-bold">Customer ID:</div>
                <div class="col-7" th:text="${booking.customerId}"></div>
            </div>
            <div class="row mb-2">
                <div class="col-5 fw-bold">Total Fare:</div>
                <div class="col-7 text-primary fw-bold" th:text="'Rs. ' + ${booking.totalFare}"></div>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:each="bookingId : ${booking.bookingIds}"
           th:href="@{/api/bookings/{id}/ticket(id=${bookingId})}"
           class="btn btn-outline-primary me-2 mb-2">
            <i class="bi bi-download me-1"></i>Download Ticket #<span th:text="${bookingId}"></span>
        </a>
    </div>

    <div class="text-center mt-3">
        <a th:if="${booking.bookingIds != null and !booking.bookingIds.isEmpty()}"
           th:href="@{/view/payments/pay/{id}(id=${booking.bookingIds[0]})}"
           class="btn btn-success btn-lg">
            <i class="bi bi-credit-card me-2"></i>Proceed to Payment
        </a>
        <a th:href="@{/view/bookings}" class="btn btn-outline-secondary btn-lg ms-2">
            <i class="bi bi-arrow-left me-1"></i>Back to Trips
        </a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
