<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Customer</title>
</head>
<body>

<h2>Update Customer</h2>

<form th:action="@{'/view/customers/update/' + ${customer.id}}" method="post">

    Name: <input type="text" th:value="${customer.name}" name="name"/><br>
    Email: <input type="text" th:value="${customer.email}" name="email"/><br>
    Phone: <input type="text" th:value="${customer.phone}" name="phone"/><br>

    <button type="submit">Update</button>
</form>

</body>
</html>
