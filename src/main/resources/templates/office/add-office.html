<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header}"></head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-shop-window me-2 text-primary"></i>Add Agency Office</h2>
        <a th:href="@{/view/offices}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Back
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <form th:action="@{/view/offices/save}" th:object="${office}" method="post" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Parent Agency</label>
                    <select class="form-select" th:field="*{agencyId}" required>
                        <option value="">-- Select Agency --</option>
                        <option th:each="a : ${agencies}" th:value="${a.agencyId}"
                                th:text="${a.name + ' (' + a.email + ')'}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Office Email</label>
                    <input type="email" class="form-control" th:field="*{officeMail}" required
                           placeholder="mumbai@red.com"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Contact Person Name</label>
                    <input type="text" class="form-control" th:field="*{officeContactPersonName}" required
                           placeholder="Amit"/>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Contact Number (10 digits)</label>
                    <input type="tel" class="form-control" th:field="*{officeContactNumber}" required
                           pattern="^\d{10}$" placeholder="9876543210"/>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Office Address</label>
                    <select class="form-select" th:field="*{officeAddressId}" required>
                        <option value="">-- Select Address --</option>
                        <option th:each="a : ${addresses}" th:value="${a.addressId}"
                                th:text="${a.address + ', ' + a.city + ' - ' + a.zipCode}"></option>
                    </select>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>Save Office
                    </button>
                    <a th:href="@{/view/offices}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
